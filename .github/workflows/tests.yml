name: Pruebas de Storidex

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas con Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORIDEX_DRY_RUN: "true"
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      FIRECRAWL_API_KEY: ""
      VIDIQ_API_KEY: ""
      ELEVENLABS_API_KEY: ""
      CANVA_ACCESS_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar las dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar las pruebas sin consumir APIs
        run: python -m pytest tests -q --junitxml=test-results/pytest.xml

      - name: Publicar el resumen de resultados
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("test-results/pytest.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Pruebas de Storidex\n\n")
              if report.is_file():
                  root = ET.parse(report).getroot()
                  suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
                  totals = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ("tests", "failures", "errors", "skipped")}
                  passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
                  summary.write(f"Total: {totals['tests']} · Aprobadas: {passed} · "
                                f"Fallos: {totals['failures']} · Errores: {totals['errors']} · "
                                f"Omitidas: {totals['skipped']}\n\n")
              else:
                  summary.write("No se produjo el informe de pytest. Revisa los pasos anteriores.\n\n")
              summary.write("Modo seco con respuestas locales o simuladas. No se configuran claves de proveedores.\n")
          PY
